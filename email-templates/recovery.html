<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f8fafc;font-family:Arial,sans-serif;color:#1f2937">
    <div style="max-width:560px;margin:32px auto;padding:32px;background:#ffffff;border:1px solid #e5e7eb;border-radius:12px">
      <h1 style="margin:0 0 12px;color:#ea580c;font-size:26px">Reset your Relay password</h1>
      <p style="line-height:1.6">Use the button below to choose a new password for <strong>{{ .Email }}</strong>.</p>
      <p style="margin:24px 0;text-align:center"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery" style="display:inline-block;padding:13px 22px;border-radius:8px;background:#ea580c;color:#ffffff;text-decoration:none;font-weight:700">Reset password</a></p>
      <p style="color:#6b7280;font-size:13px;line-height:1.5">If you did not request this reset, ignore this message and notify the project owner if you suspect misuse.</p>
    </div>
  </body>
</html>
